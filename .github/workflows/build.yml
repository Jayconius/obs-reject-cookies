name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build build_x64 --config RelWithDebInfo

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist/obs-plugins/64bit | Out-Null
          Copy-Item build_x64/RelWithDebInfo/obs-reject-cookies.dll dist/obs-plugins/64bit/
          Compress-Archive -Path dist/obs-plugins -DestinationPath "obs-reject-cookies-$version-windows-x64.zip"
          "ZIP=obs-reject-cookies-$version-windows-x64.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ZIP }}" --title "${{ github.ref_name }}" --generate-notes
